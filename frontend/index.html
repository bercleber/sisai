<!doctype html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8" />

        <meta name="viewport" content="width=device-width, initial-scale=1.0" />

        <title>Cadastro de Clientes</title>

        <link rel="stylesheet" href="style.css" />
    </head>

    <body>
        <main class="container">
            <section class="cadastro">
                <h1>Cadastro de Clientes</h1>

                <form id="form-cliente" novalidate>
                    <div class="form-grid">
                        <div class="form-group">
                            <label for="nome">Nome</label>

                            <input
                                type="text"
                                id="nome"
                                name="nome"
                                placeholder="Nome e sobrenome"
                                autocomplete="name"
                            />

                            <span class="mensagem-erro" id="erro-nome"></span>
                        </div>

                        <div class="form-group">
                            <label for="email">E-mail</label>

                            <input
                                type="email"
                                id="email"
                                name="email"
                                placeholder="email@exemplo.com"
                                autocomplete="email"
                                disabled
                            />

                            <span class="mensagem-erro" id="erro-email"></span>
                        </div>

                        <div class="form-group">
                            <label for="telefone">Telefone</label>

                            <input
                                type="tel"
                                id="telefone"
                                name="telefone"
                                placeholder="(00) 00000-0000"
                                autocomplete="tel"
                                inputmode="numeric"
                                disabled
                            />

                            <span
                                class="mensagem-erro"
                                id="erro-telefone"
                            ></span>
                        </div>

                        <div class="form-group">
                            <label for="cidade">Cidade</label>

                            <input
                                type="text"
                                id="cidade"
                                name="cidade"
                                placeholder="Cidade"
                                autocomplete="address-level2"
                                disabled
                            />

                            <span class="mensagem-erro" id="erro-cidade"></span>
                        </div>
                    </div>

                    <div class="form-actions">
                        <button type="submit" id="btn-cadastrar" disabled>
                            CADASTRAR
                        </button>
                    </div>
                </form>
            </section>

            <section class="lista-clientes">
                <h2>Clientes cadastrados</h2>

                <div class="tabela-container">
                    <table>
                        <thead>
                            <tr>
                                <th>Nome</th>
                                <th>E-mail</th>
                                <th>Telefone</th>
                                <th>Cidade</th>
                            </tr>
                        </thead>

                        <tbody id="lista-clientes">
                            <!-- Os clientes serão inseridos aqui pelo JavaScript -->
                        </tbody>
                    </table>
                </div>
            </section>
        </main>

        <script src="app.js"></script>
    </body>
</html>
